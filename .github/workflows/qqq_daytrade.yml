name: QQQ day trade ledger
# Paper ledger only (no orders, no IBKR login): replays the QQQ noise-band day trade on Yahoo 5m bars after the close
on:
  schedule:
    - cron: "30 23 * * 1-5"    # after the US close and after the Edge bot run (18:30 / 19:30 New York)
    - cron: "30 1 * * 2-6"     # second pass, picks up the Edge bot's row for the same day
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qqq-ledger             # own group: must never cancel a queued Edge bot run
  cancel-in-progress: false
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: pip install -q pandas==2.3.1 numpy==2.3.2
      - run: python3 qqq_daytrade/ledger.py
      - name: Save
        run: |
          git config user.name "qqq-ledger"; git config user.email "qqq-ledger@users.noreply.github.com"
          git add qqq_daytrade
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -qm "qqq ledger $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep 10; done; exit 1
